<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Victim Registration</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .top-left-buttons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
        }

        .top-left-buttons a {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .top-left-buttons a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        form {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: left;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #4ecdc4;
            outline: none;
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        }

        input[type="submit"] {
            background: linear-gradient(to right, #4ecdc4, #2ecc71);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .status-message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="top-left-buttons">
        <a href="AdminPage.jsp">
            <i class="fas fa-user-shield"></i> Admin Panel
        </a>
    </div>

    <form action="Secondpage.jsp" method="post" id="victimForm">
        <h2>Blood Alert System</h2>
        
        <div class="form-group">
            <label for="victimid">Patient ID:</label>
            <input type="text" id="victimid" name="victimid" required 
                   placeholder="Enter Patient	 ID">
        </div>
        <div class="form-group">
            <label for="goinghospital">Hospital Name:</label>
            <input type="text" id="goinghospital" name="goinghospital" required 
                   placeholder="Enter hospital name">
        </div>
        
        <input type="submit" value="Start">
        
        <div class="status-message" id="statusMessage"></div>
    </form>

    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <script>
        document.getElementById('victimForm').addEventListener('submit', function(e) {
            const victimId = document.getElementById('victimid').value;
            const hospital = document.getElementById('goinghospital').value;
            
            if (!victimId || !hospital) {
                e.preventDefault();
                showMessage('Please fill in all fields', 'error');
            } else {
                showMessage('Registration successful!', 'success');
            }
        });

        function showMessage(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 3000);
        }

        // Add input validation
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value.trim() !== '') {
                    this.style.borderColor = '#4ecdc4';
                } else {
                    this.style.borderColor = '#e1e1e1';
                }
            });
        });
    </script>
</body>
</html>
